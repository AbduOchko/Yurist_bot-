<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1024"/>
  <title>Юрист Бот — Менеджер</title>
  <link rel="stylesheet" href="/staff/shared/staff.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor('#0a1024'); } catch(e) {}
      try { tg.setBackgroundColor('#0a1024'); } catch(e) {}
    }
  </script>
</head>
<body>

<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </div>
    <div class="login-title">Панель менеджера</div>
    <div class="login-subtitle">Войдите по вашему логину</div>
    <div class="form-group"><label class="form-label">Логин</label><input id="loginInput" class="form-input" type="text"/></div>
    <div class="form-group"><label class="form-label">Пароль</label><input id="passwordInput" class="form-input" type="password"/></div>
    <button id="loginBtn" class="btn-primary">Войти</button>
    <div id="loginError" class="form-error"></div>
  </div>
</div>

<div id="appShell" class="app-shell hidden">
  <div class="app-header">
    <div>
      <div class="app-title">Юрист Бот</div>
      <div class="app-subtitle" id="meSubtitle">—</div>
    </div>
    <button class="btn-secondary" id="logoutBtn">Выйти</button>
  </div>

  <div class="app-tabs">
    <button class="app-tab active" data-tab="match">🔍 Подбор</button>
    <button class="app-tab" data-tab="lawyers">⚖️ Юристы</button>
    <button class="app-tab" data-tab="chats">💬 Чаты с юристами</button>
  </div>

  <div class="app-body">
    <div class="app-panel active" id="tab-match">
      <div class="chat-layout">
        <div class="chat-list-col" id="matchList"></div>
        <div class="chat-detail-col" id="matchDetail">
          <div class="chat-empty">Выберите чат подбора</div>
        </div>
      </div>
    </div>

    <div class="app-panel" id="tab-lawyers">
      <div class="toolbar">
        <button class="btn-primary" id="addLawyerBtn" style="width:auto;padding:10px 18px">+ Добавить юриста</button>
      </div>
      <div class="data-list" id="lawyersList"></div>
    </div>

    <div class="app-panel" id="tab-chats">
      <div class="chat-layout">
        <div class="chat-list-col" id="lawyerChatList"></div>
        <div class="chat-detail-col" id="lawyerChatDetail">
          <div class="chat-empty">Выберите чат</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Modal: create lawyer -->
<div id="lawyerModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">Новый юрист</div>
    <div class="form-group"><label class="form-label">ФИО</label><input id="lwName" class="form-input"/></div>
    <div class="form-group"><label class="form-label">Логин</label><input id="lwLogin" class="form-input"/></div>
    <div class="form-group"><label class="form-label">Пароль</label><input id="lwPassword" class="form-input" type="password"/></div>
    <div class="form-group"><label class="form-label">Специализация</label><input id="lwSpec" class="form-input"/></div>
    <div class="form-group"><label class="form-label">Telegram ID (опц.)</label><input id="lwTgId" class="form-input" type="number"/></div>
    <div class="form-error" id="lwError"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="lwCancel">Отмена</button>
      <button class="btn-primary" style="width:auto;padding:10px 18px" id="lwSave">Создать</button>
    </div>
  </div>
</div>

<!-- Modal: assign lawyer -->
<div id="assignModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">Назначить юриста пользователю</div>
    <div id="assignUserInfo" style="margin-bottom:12px;color:var(--text-secondary);font-size:13px"></div>
    <div class="data-list" id="assignLawyerList" style="max-height:300px;overflow-y:auto"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="assignCancel">Отмена</button>
    </div>
  </div>
</div>

<script src="/manager/js/app.js"></script>
</body>
</html>
