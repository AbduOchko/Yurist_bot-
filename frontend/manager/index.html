<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1024"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Юрист Бот — Менеджер</title>
  <link rel="stylesheet" href="/staff/shared/staff.css"/>
  <link rel="stylesheet" href="/lawyer/css/lawyer.css"/>
  <link rel="stylesheet" href="/manager/css/manager.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor('#0a1024'); } catch(e) {}
      try { tg.setBackgroundColor('#0a1024'); } catch(e) {}
    }
  </script>
</head>
<body class="lawyer-body">

<!-- ── Login ──────────────────────────────────────────────────── -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </div>
    <div class="login-title">Панель менеджера</div>
    <div class="login-subtitle">Войдите по вашему логину</div>
    <div class="form-group"><label class="form-label">Логин</label><input id="loginInput" class="form-input" type="text" autocomplete="username"/></div>
    <div class="form-group"><label class="form-label">Пароль</label><input id="passwordInput" class="form-input" type="password" autocomplete="current-password"/></div>
    <button id="loginBtn" class="btn-primary">Войти</button>
    <div id="loginError" class="form-error"></div>
  </div>
</div>

<!-- ── App ────────────────────────────────────────────────────── -->
<div id="appShell" class="mgr-shell hidden">
  <header class="lawyer-header">
    <div class="lawyer-header-info">
      <div class="lawyer-avatar" id="meAvatar">🧭</div>
      <div style="min-width:0">
        <div class="lawyer-header-name" id="meName">Менеджер</div>
        <div class="lawyer-header-sub" id="meRole">Менеджер</div>
      </div>
    </div>
    <div class="lawyer-header-actions">
      <button class="icon-btn" id="logoutBtn" title="Выйти" aria-label="Выйти">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <nav class="mgr-segment">
    <button class="mgr-seg-btn active" data-view="chats">💬 Чаты</button>
    <button class="mgr-seg-btn" data-view="groups">👥 Группы</button>
    <button class="mgr-seg-btn" data-view="lawyers">⚖️ Юристы</button>
  </nav>

  <div class="mgr-body">
    <!-- ═══ CHATS (all users inbox) ═══ -->
    <div class="mgr-view active" id="view-chats">
      <div class="mgr-chats-shell">
        <!-- LIST -->
        <section class="lawyer-view lawyer-list-view active" id="listView">
          <div class="lawyer-list-meta" id="listMeta">Загрузка…</div>
          <div class="lawyer-chat-list" id="usersList"></div>
        </section>

        <!-- CHAT -->
        <section class="lawyer-view lawyer-chat-view" id="chatView">
          <header class="lawyer-chat-header">
            <button class="icon-btn lawyer-back-btn" id="backBtn" title="Назад" aria-label="Назад">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
            </button>
            <div class="lawyer-chat-header-info">
              <div class="lawyer-chat-avatar" id="chatAvatar">👤</div>
              <div style="min-width:0;flex:1">
                <div class="lawyer-chat-header-name" id="chatHeaderName">—</div>
                <div class="lawyer-chat-header-sub" id="chatHeaderSub">—</div>
              </div>
            </div>
            <button class="icon-btn mgr-assign-btn" id="assignBtn" title="Назначить юриста" aria-label="Назначить юриста">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
            </button>
          </header>

          <div class="lawyer-chat-empty" id="chatEmpty">
            <div class="lawyer-chat-empty-icon">💬</div>
            <div>Выберите пользователя слева</div>
          </div>

          <div class="lawyer-messages hidden" id="chatMessages"></div>

          <footer class="lawyer-reply hidden" id="replyArea">
            <textarea class="lawyer-reply-input" id="replyInput" rows="1" placeholder="Сообщение пользователю…"></textarea>
            <div class="lawyer-reply-counter" id="charCounter"></div>
            <button class="lawyer-reply-send" id="replyBtn" title="Отправить" aria-label="Отправить">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
            </button>
          </footer>
        </section>
      </div>
    </div>

    <!-- ═══ GROUPS (user + lawyer + manager) ═══ -->
    <div class="mgr-view" id="view-groups">
      <div class="mgr-chats-shell">
        <section class="lawyer-view lawyer-list-view active" id="groupListView">
          <div class="lawyer-list-meta">
            <button class="btn-primary" id="createGroupBtn" style="width:100%;padding:11px">+ Создать общий чат</button>
          </div>
          <div class="lawyer-chat-list" id="groupsList"></div>
        </section>
        <section class="lawyer-view lawyer-chat-view" id="groupChatView">
          <header class="lawyer-chat-header">
            <button class="icon-btn lawyer-back-btn" id="groupBackBtn" title="Назад" aria-label="Назад">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
            </button>
            <div class="lawyer-chat-header-info">
              <div class="lawyer-chat-avatar" style="background:linear-gradient(135deg,#2563eb,#1e3a8a)">👥</div>
              <div style="min-width:0;flex:1">
                <div class="lawyer-chat-header-name" id="groupHeaderName">Общий чат</div>
                <div class="lawyer-chat-header-sub" id="groupHeaderSub">—</div>
              </div>
            </div>
          </header>
          <div class="lawyer-chat-empty" id="groupChatEmpty">
            <div class="lawyer-chat-empty-icon">👥</div>
            <div>Выберите общий чат слева</div>
          </div>
          <div class="lawyer-messages hidden" id="groupMessages"></div>
          <footer class="lawyer-reply hidden" id="groupReplyArea">
            <textarea class="lawyer-reply-input" id="groupReplyInput" rows="1" placeholder="Сообщение в общий чат…"></textarea>
            <button class="lawyer-reply-send" id="groupReplyBtn" title="Отправить" aria-label="Отправить">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
            </button>
          </footer>
        </section>
      </div>
    </div>

    <!-- ═══ LAWYERS (by category) ═══ -->
    <div class="mgr-view" id="view-lawyers">
      <div class="mgr-lawyers">
        <div class="mgr-lawyers-toolbar">
          <button class="btn-primary" id="addLawyerBtn" style="width:auto;padding:10px 18px">+ Добавить юриста</button>
        </div>
        <div id="lawyersByCategory"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- Modal: create lawyer -->
<div id="lawyerModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">Новый юрист</div>
    <div class="form-group"><label class="form-label">ФИО</label><input id="lwName" class="form-input"/></div>
    <div class="form-group"><label class="form-label">Логин</label><input id="lwLogin" class="form-input"/></div>
    <div class="form-group"><label class="form-label">Пароль (мин. 8)</label><input id="lwPassword" class="form-input" type="password"/></div>
    <div class="form-group"><label class="form-label">Специализация (категория)</label><input id="lwSpec" class="form-input" placeholder="напр. Семейное право"/></div>
    <div class="form-group"><label class="form-label">Telegram ID (опц.)</label><input id="lwTgId" class="form-input" type="number"/></div>
    <div class="form-error" id="lwError"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="lwCancel">Отмена</button>
      <button class="btn-primary" style="width:auto;padding:10px 18px" id="lwSave">Создать</button>
    </div>
  </div>
</div>

<!-- Modal: assign lawyer -->
<div id="assignModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">Назначить юриста пользователю</div>
    <div id="assignUserInfo" style="margin-bottom:12px;color:var(--text-secondary);font-size:13px"></div>
    <div class="data-list" id="assignLawyerList" style="max-height:320px;overflow-y:auto"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="assignCancel">Отмена</button>
    </div>
  </div>
</div>

<!-- Modal: create group chat -->
<div id="groupModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-title">Создать общий чат</div>
    <div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px">Общий чат на троих: выбранный пользователь, выбранный юрист и вы.</div>
    <div class="form-group"><label class="form-label">Пользователь</label><select id="grpUser" class="form-input"></select></div>
    <div class="form-group"><label class="form-label">Юрист</label><select id="grpLawyer" class="form-input"></select></div>
    <div class="form-error" id="grpError"></div>
    <div class="modal-footer">
      <button class="btn-secondary" id="grpCancel">Отмена</button>
      <button class="btn-primary" style="width:auto;padding:10px 18px" id="grpSave">Создать</button>
    </div>
  </div>
</div>

<script src="/manager/js/app.js"></script>
</body>
</html>
