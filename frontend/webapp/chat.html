<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1024"/>
  <title>Чат</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    // Disable pinch-to-zoom
    document.addEventListener('touchmove', function(e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
  </script>
</head>
<body>
  <div class="chat-page">

    <!-- Chat Header -->
    <div class="chat-header">
      <button class="back-btn" id="backBtn" aria-label="Назад">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="chat-avatar" id="chatAvatar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </div>
      <div class="chat-info">
        <h2 id="chatTitle">Загрузка...</h2>
        <div class="chat-status">
          <div class="status-dot" id="statusDot"></div>
          <span class="status-text" id="statusText">онлайн</span>
        </div>
      </div>
    </div>

    <!-- Pinned Message Bar -->
    <div class="pinned-bar hidden" id="pinnedBar">
      <div class="pinned-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div class="pinned-content">
        <div class="pinned-label">Закреплено</div>
        <div class="pinned-text" id="pinnedText"></div>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-list" id="messagesList">
      <div class="loading">
        <div class="loading-spinner"></div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area" id="inputArea" style="position:relative">
      <!-- Edit/Reply Banner -->
      <div class="edit-banner hidden" id="editBanner">
        <div class="edit-banner-icon" id="editBannerIcon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </div>
        <div class="edit-banner-content">
          <div class="edit-banner-label" id="editBannerLabel">Редактирование</div>
          <div class="edit-banner-text" id="editBannerText"></div>
        </div>
        <button class="edit-banner-close" id="editBannerClose">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Attach Menu -->
      <div class="attach-menu hidden" id="attachMenu">
        <div class="attach-option" id="attachImage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21,15 16,10 5,21"/>
          </svg>
          Фото / Видео
        </div>
        <div class="attach-option" id="attachAudio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
          Аудио
        </div>
        <div class="attach-option" id="attachFile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          Файл
        </div>
      </div>

      <!-- Recording indicator (shown while holding mic) -->
      <div class="recording-row hidden" id="recordingRow">
        <button class="rec-cancel-btn" id="recCancelBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="rec-bars">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="rec-timer" id="recTimer">0:00</div>
        <div class="rec-hint">Отпустите для отправки</div>
      </div>

      <div class="input-row" id="inputRow">
        <button class="attach-btn" id="attachBtn" aria-label="Прикрепить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>

        <div class="text-input-wrap">
          <textarea
            class="text-input"
            id="textInput"
            placeholder="Сообщение..."
            rows="1"
            maxlength="4000"
          ></textarea>
        </div>

        <button class="voice-btn" id="voiceBtn" aria-label="Голосовое сообщение">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <button class="send-btn" id="sendBtn" disabled aria-label="Отправить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22,2 15,22 11,13 2,9"/>
          </svg>
        </button>
      </div><!-- end input-row -->
    </div>
  </div>

  <!-- Context Menu Overlay -->
  <div class="context-overlay hidden" id="contextOverlay"></div>
  <div class="context-menu hidden" id="contextMenu">
    <div class="context-menu-item" id="ctxPin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span id="ctxPinText">Закрепить</span>
    </div>
    <div class="context-menu-item" id="ctxReply">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9,17 4,12 9,7"/>
        <path d="M20 18v-2a4 4 0 0 0-4-4H4"/>
      </svg>
      Ответить
    </div>
    <div class="context-menu-item" id="ctxEdit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Изменить
    </div>
    <div class="context-menu-item" id="ctxCopy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Копировать
    </div>
    <div class="context-menu-item" id="ctxDownload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7,10 12,15 17,10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Скачать
    </div>
    <div class="context-menu-item" id="ctxForward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15,17 20,12 15,7"/>
        <path d="M4 18v-2a4 4 0 0 1 4-4h12"/>
      </svg>
      Переслать
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item danger" id="ctxDelete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3,6 5,6 21,6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      Удалить
    </div>
  </div>

  <!-- Forward Modal -->
  <div class="modal-overlay hidden" id="forwardModal">
    <div class="modal-sheet">
      <div class="modal-title">Переслать в...</div>
      <div class="forward-options" id="forwardOptions"></div>
      <button class="modal-cancel" id="forwardCancel">Отмена</button>
    </div>
  </div>

  <!-- Image Viewer -->
  <div class="image-viewer hidden" id="imageViewer">
    <button class="image-viewer-close" id="imageViewerClose">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <img id="imageViewerImg" src="" alt=""/>
  </div>

  <!-- Hidden file inputs -->
  <input type="file" id="fileInputImage" accept="image/*,video/*" style="display:none"/>
  <input type="file" id="fileInputAudio" accept="audio/*" style="display:none"/>
  <input type="file" id="fileInputFile" style="display:none"/>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/js/chat.js"></script>
</body>
</html>
