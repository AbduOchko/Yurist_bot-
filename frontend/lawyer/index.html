<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a1024"/>
  <title>Юрист Бот — Юрист</title>
  <link rel="stylesheet" href="/staff/shared/staff.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor('#0a1024'); } catch(e) {}
      try { tg.setBackgroundColor('#0a1024'); } catch(e) {}
    }
  </script>
</head>
<body>

<!-- ── Login screen ────────────────────────────────────────────── -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <div class="login-title">Панель юриста</div>
    <div class="login-subtitle">Войдите по вашему логину</div>

    <div class="form-group">
      <label class="form-label">Логин</label>
      <input id="loginInput" class="form-input" type="text" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input id="passwordInput" class="form-input" type="password" autocomplete="current-password"/>
    </div>

    <button id="loginBtn" class="btn-primary">Войти</button>
    <div id="loginError" class="form-error"></div>
  </div>
</div>

<!-- ── Main app shell ─────────────────────────────────────────── -->
<div id="appShell" class="app-shell hidden">
  <div class="app-header">
    <div>
      <div class="app-title">Юрист Бот</div>
      <div class="app-subtitle" id="meSubtitle">—</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer">
        <input type="checkbox" id="onlineToggle"/> Онлайн
      </label>
      <button class="btn-secondary" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div class="app-body">
    <div class="chat-layout">
      <div class="chat-list-col" id="chatList"></div>
      <div class="chat-detail-col" id="chatDetail">
        <div class="chat-empty">Выберите чат слева</div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/lawyer/js/app.js"></script>
</body>
</html>
